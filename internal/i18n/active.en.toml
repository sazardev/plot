["cli.help.short"]
description = "Short command description."
other = "terminal data plotter"

["cli.help.preamble"]
description = "One-line and multi-line help introduction."
other = """pl - terminal data plotter

Reads delimited data from stdin or a file, infers columns and renders a chart."""

["cli.help.usage_label"]
description = "Label before the usage line."
other = "Usage"

["cli.help.input_label"]
description = "Label before the input description."
other = "Input"

["cli.help.input"]
description = "Input modes supported by the CLI."
other = """  stdin is read when it is not a TTY and no file is given.
  Use '-' to read stdin explicitly; pass one or more matching files to concatenate them.
  Use --db with --query/--query-file for a read-only SQLite query.
  Use --tui for the interactive view; it requires a file or database source."""

["cli.help.types_label"]
description = "Label before supported chart types."
other = "Chart types"

["cli.help.types"]
description = "Supported chart types and the default rule."
other = """  line, bar, pie, donut; aliases: plot (line), graph (bar)
  Default: bar for one categorical series with at most 30 rows, otherwise line.
  Pie/donut need exactly one non-negative series with 2-12 unique slices."""

["cli.help.flags_label"]
description = "Label before the flag table."
other = "Flags"

["cli.help.examples_label"]
description = "Label before examples."
other = "Examples"

["cli.help.examples"]
description = "Example invocations."
other = """  printf 'day,signups\\nMon,3\\nTue,5\\n' | pl
  pl sales.csv
  pl sales.csv --columns revenue --sort revenue:desc --filter 'revenue>=1000'
  pl --db metrics.db --query 'select day, signups from metrics'
  pl sales.csv --type bar --title 'Revenue'"""

["cli.help.exit_label"]
description = "Label before the exit-code summary."
other = "Exit codes"

["cli.help.exit_codes"]
description = "Exit-code summary shown by --help."
other = "  0 success; 1 data/environment error; 2 usage error; 3 source error; 130 interrupted; 141 broken pipe"

